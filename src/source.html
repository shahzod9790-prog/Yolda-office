<script>
// ---------------- Avtomatik yangilanish ----------------
// Ilovaning "build raqami" yig'ishda (src/build.mjs) shu yerga yoziladi; server eng oxirgisini /version.json da beradi.

// ---------------- Hosila hisob (haydovchi ilovasidagi bilan bir xil mantiq) ----------------
function deriveTrip(trip) {
  let km = trip.startKm, motoChas = trip.startMotoChas;
  let tractorStartKm = trip.startKm, trailerStartMotoChas = trip.startMotoChas;
  let curTractor = trip.tractorNumber, curTrailer = trip.trailerNumber;
  const history = [];
  for (const ev of trip.history) {
    const item = { ...ev };
    switch (ev.type) {
      case "zagruzka": case "zapravka": { item.distance = num(ev.km) - km; km = num(ev.km); break; }
      case "vigruzka": { item.distance = num(ev.km) - km; km = num(ev.km); item.motoChasWorked = num(ev.motoChas) - motoChas; motoChas = num(ev.motoChas); break; }
      case "tractor_end": { item.distance = num(ev.km) - km; km = num(ev.km); break; }
      case "tractor_confirmed": { km = num(ev.newKm); tractorStartKm = km; curTractor = ev.newTractorNumber; break; }
      case "trailer_end": { item.distance = num(ev.km) - km; km = num(ev.km); curTrailer = null; break; }
      case "trailer_confirmed": { motoChas = num(ev.motoChas); trailerStartMotoChas = motoChas; curTrailer = ev.newTrailerNumber; break; }
      default: break;
    }
    history.push(item);
  }
  return { history, lastKm: km, lastMotoChas: motoChas, currentTractorStartKm: tractorStartKm, currentTrailerStartMotoChas: trailerStartMotoChas, tractorNumber: curTractor, trailerNumber: curTrailer };
}
const CHANGE_LABELS = { tractor_end: "Tyagach yakunlandi", tractor_accepted: "Yangi tyagach qabul qilindi", tractor_confirmed: "Tyagach almashinuvi tasdiqlandi", trailer_end: "Prisep yakunlandi", trailer_accepted: "Yangi prisep qabul qilindi", trailer_confirmed: "Prisep almashinuvi tasdiqlandi" };
function dayKeyOf(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function computeFiles(history) {
  const days = []; const byKey = {};
  history.forEach((ev) => {
    if (!["zagruzka", "zapravka", "vigruzka"].includes(ev.type)) return;
    const key = dayKeyOf(ev.at);
    if (!byKey[key]) { byKey[key] = { dayKey: key, dayLabel: new Date(ev.at).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" }), zagruzkas: [], zapravkas: [], vigruzkas: [] }; days.push(byKey[key]); }
    if (ev.type === "zagruzka") byKey[key].zagruzkas.push(ev);
    if (ev.type === "zapravka") byKey[key].zapravkas.push(ev);
    if (ev.type === "vigruzka") byKey[key].vigruzkas.push(ev);
  });
  return days;
}
function rowToEvent(row) { return { ...row.data, id: row.id, type: row.type, at: new Date(row.at).getTime(), batchId: row.batch_id || null }; }
async function fetchTripFull(tripId) {
  const { data: tripRow } = await sb.from("trips").select("*, driver:drivers(first_name,last_name)").eq("id", tripId).single();
  if (!tripRow) return null;
  const { data: eventRows } = await sb.from("trip_events").select("*").eq("trip_id", tripId).order("at", { ascending: true });
  const { data: sendRows } = await sb.from("trip_sends").select("*").eq("trip_id", tripId).order("batch_number", { ascending: true });
  return {
    id: tripRow.id, startedAt: new Date(tripRow.started_at).getTime(),
    tractorNumber: tripRow.tractor_number, trailerNumber: tripRow.trailer_number,
    driverLabel: tripRow.driver ? `${tripRow.driver.first_name} ${tripRow.driver.last_name}` : "Noma'lum haydovchi",
    startKm: Number(tripRow.start_km), startMotoChas: Number(tripRow.start_moto_chas),
    motoChasPhoto: tripRow.moto_chas_photo,
    completed: tripRow.completed,
    history: (eventRows || []).map(rowToEvent),
    sends: (sendRows || []).map((r) => ({ id: r.id, batchNumber: r.batch_number, sentAt: new Date(r.sent_at).getTime() })),
  };
}
function batchEventsFor(history, batchId) { return history.filter((e) => e.batchId === batchId).sort((a, b) => a.at - b.at); }
const BATCH_FIELDS = {
  zagruzka: ["address", "km", "distance"],
  zapravka: ["km", "distance", "tractorLiters", "trailerLiters", "adBlue"],
  vigruzka: ["address", "km", "distance", "motoChas", "motoChasWorked"],
};
function formatFieldValue(f, v) {
  if (f === "loadStatus") return LOAD_LABELS[v] || v;
  if (f === "km" || f === "distance" || f === "newKm") return `${fmt(v)} km`;
  if (f === "motoChas" || f === "motoChasWorked") return `${fmt(v)} soat`;
  if (f.toLowerCase().includes("liters") || f === "adBlue") return `${fmt(v)} l`;
  return v;
}
function buildBatchText(trip, events) {
  const lines = [`YO'LDA — yuborilgan ma'lumotlar`, `Haydovchi: ${trip.driverLabel}`, `Tyagach: ${trip.tractorNumber || ""}   Prisep: ${trip.trailerNumber || "YO'Q"}`, ""];
  events.forEach((ev) => {
    const label = ev.type === "zagruzka" ? "ZAGRUZKA" : ev.type === "zapravka" ? "ZAPRAVKA" : ev.type === "vigruzka" ? "VIGRUZKA" : (CHANGE_LABELS[ev.type] || ev.type);
    lines.push(`[${label}] ${fmtDate(ev.at)}`);
    const fields = BATCH_FIELDS[ev.type] || ["address", "km", "newKm", "motoChas", "loadStatus", "newTractorNumber", "newTrailerNumber"];
    fields.forEach((f) => { if (ev[f] !== undefined && ev[f] !== null && ev[f] !== "") lines.push(`  ${FIELD_LABELS[f]}: ${formatFieldValue(f, ev[f])}`); });
    lines.push("");
  });
  return lines.join("\n");
}

        <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10 }}>Haydovchi: <b style={{ color: COLORS.text }}>{trip.driverLabel}</b></div>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
          <div><div style={{ fontSize: 10.5, color: COLORS.muted, letterSpacing: 0.5 }}>TYAGACH</div><div style={{ fontFamily: "Oswald", fontSize: 18, fontWeight: 700 }}>{derived.tractorNumber}</div></div>
          <div style={{ textAlign: "right" }}><div style={{ fontSize: 10.5, color: COLORS.muted, letterSpacing: 0.5 }}>PRISEP</div><div style={{ fontFamily: "Oswald", fontSize: 18, fontWeight: 700, color: derived.trailerNumber ? COLORS.text : COLORS.red }}>{derived.trailerNumber || "PRISEPSIZ"}</div></div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <Readout label="Joriy km" value={fmt(derived.lastKm)} unit="km" />
          <Readout label="Moto-soat" value={fmt(derived.lastMotoChas)} unit="soat" tone="amber" />
        </div>
        {trip.completed && <div style={{ marginTop: 12, fontSize: 11, color: COLORS.muted }}>Bu reys yakunlangan.</div>}
      </Panel>

      {pendingFiles.length > 0 && (
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}><Clock size={14} color={COLORS.amber} /><span style={{ fontFamily: "Oswald", fontSize: 14, fontWeight: 600, color: COLORS.amber }}>Jarayonda (hali tasdiqlanmagan)</span></div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {pendingFiles.map((f) => {
              const key = `p-${f.dayKey}`; const isOpen = openId === key;
              return (
                <Panel key={key} style={{ padding: 0, overflow: "hidden", borderColor: COLORS.amber + "44" }}>
                  <button onClick={() => setOpenId(isOpen ? null : key)} style={{ width: "100%", background: "transparent", border: "none", padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: COLORS.text }}>
                    <div style={{ textAlign: "left" }}><div style={{ fontFamily: "Oswald", fontSize: 14, fontWeight: 600 }}>{f.dayLabel}</div><div style={{ fontSize: 11, color: COLORS.muted, marginTop: 2 }}>{[f.zagruzkas.length > 0 && `Zagruzka ×${f.zagruzkas.length}`, f.zapravkas.length > 0 && `Zapravka ×${f.zapravkas.length}`, f.vigruzkas.length > 0 && `Vigruzka ×${f.vigruzkas.length}`].filter(Boolean).join(" · ")}</div></div>
                    {isOpen ? <ChevronLeft size={16} color={COLORS.muted} /> : <ChevronRight size={16} color={COLORS.muted} />}
                  </button>
                  {isOpen && <div style={{ padding: "0 16px 16px", borderTop: `1px solid ${COLORS.border}`, paddingTop: 14, display: "flex", flexDirection: "column", gap: 14 }}>{renderFileEvents(f)}</div>}
                </Panel>
              );
            })}
          </div>
        </div>
      )}

      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}><Lock size={14} color={COLORS.green} /><span style={{ fontFamily: "Oswald", fontSize: 14, fontWeight: 600, color: COLORS.green }}>Yuborilgan jo'natishlar</span></div>
        {trip.sends.length === 0 && <Panel style={{ textAlign: "center", padding: "20px", color: COLORS.muted, fontSize: 12.5 }}>Hali hech narsa yuborilmagan</Panel>}
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {[...trip.sends].reverse().map((batch) => {
            const events = batchEventsFor(derived.history, batch.id);
            if (events.length === 0) return null;
            const fromAt = events[0].at, toAt = events[events.length - 1].at;
            const key = `b-${batch.id}`; const isOpen = openId === key;
            return (
              <Panel key={key} style={{ padding: 0, overflow: "hidden" }}>
                <button onClick={() => setOpenId(isOpen ? null : key)} style={{ width: "100%", background: "transparent", border: "none", padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: COLORS.text }}>
                  <div style={{ textAlign: "left" }}>
                    <div style={{ fontFamily: "Oswald", fontSize: 14, fontWeight: 600 }}>🔒 {batch.batchNumber}-jo'natish</div>
                    <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 2 }}>Boshlang'ich: {fmtDate(fromAt)}</div>
                    <div style={{ fontSize: 11, color: COLORS.muted }}>Tugash: {fmtDate(toAt)}</div>
                  </div>
                  {isOpen ? <ChevronLeft size={16} color={COLORS.muted} /> : <ChevronRight size={16} color={COLORS.muted} />}
                </button>
                {isOpen && (
                  <div style={{ padding: "0 16px 16px", borderTop: `1px solid ${COLORS.border}`, paddingTop: 14, display: "flex", flexDirection: "column", gap: 14 }}>
                    <button onClick={() => copyBatch(batch, events)} style={{ alignSelf: "flex-start", background: COLORS.panel2, border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "8px 14px", color: COLORS.amber, fontFamily: "Inter", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>{copiedId === batch.id ? "Nusxalandi ✓" : "📋 Nusxalash"}</button>
                    {events.map((ev) => <EventDetail key={ev.id} label={ev.type === "zagruzka" ? "ZAGRUZKA" : ev.type === "zapravka" ? "ZAPRAVKA" : ev.type === "vigruzka" ? "VIGRUZKA" : (CHANGE_LABELS[ev.type] || ev.type)} ev={ev} fields={ev.type === "zagruzka" ? ["address", "km", "distance"] : ev.type === "zapravka" ? ["km", "distance", "tractorLiters", "trailerLiters", "adBlue"] : ev.type === "vigruzka" ? ["address", "km", "distance", "motoChas", "motoChasWorked"] : ["address", "km", "newKm", "motoChas", "loadStatus", "newTractorNumber", "newTrailerNumber"]} />)}
                  </div>
                )}
              </Panel>
            );
          })}
        </div>
      </div>

      {changes.length > 0 && (
        <div>
          <div style={{ fontFamily: "Oswald", fontSize: 14, fontWeight: 600, marginBottom: 10 }}>Transport almashinuvlari</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {changes.map((ev) => <EventDetail key={ev.id} label={CHANGE_LABELS[ev.type]} ev={ev} fields={["address", "km", "newKm", "motoChas", "loadStatus", "newTractorNumber", "newTrailerNumber"]} standalonePanel />)}
          </div>
        </div>
      )}
    </div>
  );
}

(window.__bootGate || Promise.resolve()).then(function () { ReactDOM.createRoot(document.getElementById("root")).render(<App />); });
</script>
<script>
// Ilovani telefonga o'rnatish imkoniyati uchun (hech narsani keshlamaydi)
if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
</script>
</body>
</html>
