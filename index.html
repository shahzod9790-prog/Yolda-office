<style>
  /* Ekran o'lchamiga moslash: sahifa aniq ekran balandligicha (dvh — brauzer paneli hisobga olinadi), ortiqcha siljish, bounce va zoom yo'q */

  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; overscroll-behavior: none; background: #14171A; color: #ECEDEE; font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100vh; min-height: 100dvh; }
  /* Xavfsiz maydonlar (notch / pastki chiziq) bu yerda bir marta hisobga olinadi — ilgari html ga qo'shilib, sahifani ekrandan balandroq qilib qo'ygan edi */
  .app-shell { min-height: 100vh; min-height: 100dvh; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  /* iPhone Safari 16 pikseldan kichik yozuvli maydonga bosilganda sahifani o'zi kattalashtirib yuboradi — shuni oldini oladi */
  input, textarea, select { font-size: 16px !important; }
  input, button { font-family: inherit; }
  /* Avtomatik yangilanish: ochilish ekrani, "Yangilanmoqda" qatlami va "yangi versiya bor" bandi */
  .yb { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #14171A; color: #ECEDEE; font-family: Inter, system-ui, -apple-system, sans-serif; }
  #yolda-upd { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2147483000; min-height: 0; }
  .yb-logo { font-size: 30px; font-weight: 700; letter-spacing: 2px; color: #F5A623; }
  .yb-spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2B3138; border-top-color: #F5A623; animation: yb-rot .8s linear infinite; }
  .yb-txt { font-size: 14px; color: #828A93; min-height: 18px; }
  @keyframes yb-rot { to { transform: rotate(360deg); } }
  #yolda-upd-banner { position: fixed; left: 8px; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 2147482000; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #F5A623; color: #14171A; font: 600 13px/1.3 Inter, system-ui, -apple-system, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #yolda-upd-banner button { flex: none; border: 0; border-radius: 8px; padding: 8px 12px; background: #14171A; color: #F5A623; font: 700 13px Inter, system-ui, -apple-system, sans-serif; }
  /* Ofis (kompyuter): chapda yig'iladigan panel + asosiy maydon */
  .app-wide { height: 100vh; height: 100dvh; overflow: hidden; }
  .thin-scroll { scrollbar-width: thin; scrollbar-color: #2B3138 transparent; }
  .thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .thin-scroll::-webkit-scrollbar-thumb { background: #2B3138; border-radius: 8px; }
  .hov:hover { background: #232830 !important; }
  .hov:focus-visible, .menu-btn:focus-visible { outline: 2px solid #F5A623; outline-offset: -2px; }
  .side-anim { transition: width .18s ease; }
  @media (prefers-reduced-motion: reduce) { .side-anim { transition: none; } }

<script>
// ---------------- Avtomatik yangilanish ----------------
// Ilovaning "build raqami" yig'ishda (src/build.mjs) shu yerga yoziladi; server eng oxirgisini /version.json da beradi.
// Ilova ochilganda (belgini bosganda) va fondan qaytganda raqamlar solishtiriladi: yangi versiya bo'lsa — "Yangilanmoqda…" deb
// o'zi qayta yuklaydi. Internet yo'q yoki sekin bo'lsa kutib o'tirmaydi, mavjud versiya bilan ochiladi. Yarim to'ldirilgan forma,
// ochiq oyna yoki jo'natilayotgan ma'lumot bo'lsa o'zi qayta yuklamaydi — "Yangilash" tugmali band chiqaradi.

  function check(ms) {

          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { end(j && typeof j.build === "string" && /^[a-f0-9]{6,64}$/.test(j.build) && j.build !== BUILD ? j.build : null); })

  }

  function overlay(text) {

    }
    o.lastChild.textContent = text;
  }

  // Shu build uchun allaqachon qayta yuklash urinilganmi? (URL dagi ?v=... — eski nusxa kelib qolsa, cheksiz qayta yuklanmaydi)

    // Zaxira: 8 soniyada sahifa almashmasa (masalan, internet uzilsa) qatlamni olib, mavjud ilovani ochamiz
    setTimeout(function () { var o = D.getElementById("yolda-upd"); if (o && o.parentNode) o.parentNode.removeChild(o); openApp(); }, 8000);
    return true;
  }

  // Ilovada saqlanmagan ish bormi? Ochiq oyna/kamera, yozilgan matn yoki jo'natilayotgan so'rov bo'lsa — ha.
  function busy() {
    if (writes > 0 || D.querySelector("[data-keep]")) return true;
    var els = D.querySelectorAll("input,textarea");
    for (var i = 0; i < els.length; i++) {
      var e = els[i], t = String(e.type || "").toLowerCase();
      if (e.hasAttribute("data-nodraft") || /^(file|hidden|checkbox|radio|button|submit)$/.test(t)) continue;
      if (String(e.value || "").replace(/\s+/g, "") !== "") return true;
    }
    return false;
  }

  function banner(target, text) {
    if (!D.body || D.getElementById("yolda-upd-banner")) return;
    var b = D.createElement("div"), s = D.createElement("span"), k = D.createElement("button");
    b.id = "yolda-upd-banner"; b.setAttribute("role", "alert"); s.textContent = text; k.type = "button"; k.textContent = "Yangilash";
    k.onclick = function () { if (!apply(target) && b.parentNode) b.parentNode.removeChild(b); };
    b.appendChild(s); b.appendChild(k); D.body.appendChild(b);
  }

  // Ilovaga qaytganda (fondan) — bo'sh bo'lsa darrov yangilaydi, band bo'lsa bandda taklif qiladi; vaqti-vaqti bilan faqat taklif
  var last = 0;
  function entry(kind) {
    if (D.hidden) return;
    var now = Date.now(); if (now - last < 3000) return; last = now;
    check(4000).then(function (target) {
      if (!target || tried(target)) return;
      if (kind === "resume" && !busy() && apply(target)) return;
      banner(target, kind === "resume" ? "Yangi versiya bor — ishni tugatgach yangilang" : "Yangi versiya bor");
    });
  }
  D.addEventListener("visibilitychange", function () { if (!D.hidden) entry("resume"); });
  W.addEventListener("pageshow", function (e) { if (e.persisted) entry("resume"); });
  W.addEventListener("online", function () { entry("periodic"); });
  setInterval(function () { entry("periodic"); }, 10 * 60 * 1000);

  W.__yoldaUpd = { busy: busy, check: check };

  // Sovuq start (belgini bosdik): avval tekshiramiz (ko'pi bilan 2,5 soniya), yangi bo'lsa yangilab, so'ng ilovani ochamiz
  check(2500).then(function (target) { if (!(target && apply(target))) openApp(); }, function () { openApp(); });
})();
